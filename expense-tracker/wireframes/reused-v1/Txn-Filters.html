<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Transaction filters</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 16px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #D0D7DE">
    <a href="../v2/V2-Money.html" aria-label="Close filters" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
    <div style="flex-grow: 1; font-size: 17px; font-weight: 600">Filters</div>
    <button type="button" style="height: 44px; padding: 0 8px; border: none; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #0B57D0">Reset</button>
  </div>

  <div style="flex-grow: 1; padding: 8px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Date</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 2px solid #1F2328; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1F2328">This month</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Last month</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Custom…</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Money</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 2px solid #1F2328; background: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; color: #1F2328">Out (debits)</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">In (credits)</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Method</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">UPI</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Credit card</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Debit card</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Net banking</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">ATM</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Wallet</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Cash</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600">Answer</span>
      <div style="display: flex; flex-wrap: wrap; gap: 6px">
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Unanswered</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Mine</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Split</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Not mine</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Between my accounts</button>
        <button type="button" style="height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Failed</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EAEEF2; font-size: 14px"><span style="font-weight: 600">Account</span><span style="color: #57606A">Any ›</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EAEEF2; font-size: 14px"><span style="font-weight: 600">Category</span><span style="color: #57606A">Any ›</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EAEEF2; font-size: 14px"><span style="font-weight: 600">Person</span><span style="color: #57606A">Any ›</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EAEEF2; font-size: 14px"><span style="font-weight: 600">Place</span><span style="color: #57606A">Any ›</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid #EAEEF2; border-bottom: 1px solid #EAEEF2; font-size: 14px"><span style="font-weight: 600">Trip</span><span style="color: #57606A">Any ›</span></div>
    </div>
  </div>

  <div style="border-top: 1px solid #D0D7DE; padding: 12px 16px 24px">
    <a href="../v2/V2-Money.html" style="height: 52px; border-radius: 26px; background: #0B57D0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Show [N] payments</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
