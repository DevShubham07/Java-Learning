  <div style="display: flex; flex-direction: column; gap: 12px">

      <div style="flex-grow: 1; height: 4px; border-radius: 2px; background: #D0D7DE"></div>
    </div>
    <div style="font-size: 13px; color: #57606A">Step 2 of 5</div>
    <h1 style="margin: 0; font-size: 24px; font-weight: 600">Your banks and apps</h1>
    <p style="margin: 0; font-size: 14px; color: #424A53; line-height: 1.5">So the app knows which SMS formats to read. We ticked the ones found in your inbox.</p>

  </label>

      <label style="height: 48px; border-radius: 12px; border: 1px solid #8C959F; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px">Kotak</label>
      <label style="height: 48px; border-radius: 12px; border: 1px solid #8C959F; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 18px; height: 18px">More…</label>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="height: 48px; border-radius: 12px; border: 2px solid #1F2328; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500"><input type="checkbox" checked style="width: 18px; height: 18px">GPay</label>
      <label style="height: 48px; border-radius: 12px; border: 2px solid #1F2328; padding: 0 12px; display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500"><input type="checkbox" checked style="width: 18px; height: 18px">PhonePe</label>

</div>
