<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settle up</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 16px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #D0D7DE">
    <a href="../v2/V2-Person-Sheet.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 600">Settle up with Aman</div>
  </div>

  <div style="flex-grow: 1; padding: 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #57606A; letter-spacing: 0.06em">A · AUTO MATCH (S7)</span>
      <div style="border: 2px solid #1F2328; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 15px; line-height: 1.4"><strong>₹290 arrived</strong> from Aman's UPI ID into HDFC ••1102 at 9:58 pm.</span>
        <span style="font-size: 13px; color: #424A53">Mark their ₹290 balance as settled?</span>
        <div style="display: flex; gap: 8px">
          <a href="../v2/V2-People.html" style="flex-grow: 2; height: 44px; border-radius: 22px; background: #0B57D0; color: #FFFFFF; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Yes, settled</a>
          <button type="button" style="flex-grow: 1; height: 44px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">No, other income</button>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #57606A; letter-spacing: 0.06em">B · RECORD BY HAND (S8)</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EAEEF2; border-radius: 12px; padding: 4px; gap: 4px">
        <button type="button" style="height: 40px; border-radius: 9px; border: none; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1F2328">Aman paid me</button>
        <button type="button" style="height: 40px; border-radius: 9px; border: none; background: transparent; font: inherit; font-size: 14px; color: #424A53">I paid Aman</button>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #57606A">Amount
        <input type="text" value="₹290" style="height: 52px; border-radius: 12px; border: 1px solid #8C959F; padding: 0 14px; font: inherit; font-size: 20px; font-weight: 600; color: #1F2328; box-sizing: border-box">
      </label>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 2px solid #1F2328; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1F2328">Cash</button>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">UPI / bank</button>
        <button type="button" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Today ▾</button>
      </div>
      <span style="font-size: 12px; color: #57606A">Cash received is added to your Cash account.</span>
    </div>
  </div>

  <div style="border-top: 1px solid #D0D7DE; padding: 12px 16px 24px; display: flex; gap: 8px">
    <button type="button" style="flex-grow: 1; height: 52px; border-radius: 26px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; color: #1F2328">Write off</button>
    <a href="../v2/V2-People.html" style="flex-grow: 2; height: 52px; border-radius: 26px; background: #1F2328; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Save settlement</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
