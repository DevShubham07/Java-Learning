      <button type="button" style="height: 40px; border-radius: 9px; border: none; background: transparent; font: inherit; font-size: 14px; color: #424A53">Shares</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 0">
      <div style="display: flex; align-items: center; height: 52px; border-bottom: 1px solid #EAEEF2; font-size: 15px"><span style="flex-grow: 1; font-weight: 500">Me</span><span style="font-weight: 600">₹400.00</span></div>
