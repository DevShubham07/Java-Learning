      <label style="border-radius: 12px; border: 1px solid #8C959F; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px"><input type="radio" name="mine" style="width: 20px; height: 20px; margin: 2px 0 0">
        <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Same as one I already have</strong><span style="font-size: 13px; color: #57606A">Merge into an existing account.</span></span></label>
      <label style="border-radius: 12px; border: 1px solid #8C959F; padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px"><input type="radio" name="mine" style="width: 20px; height: 20px; margin: 2px 0 0">
