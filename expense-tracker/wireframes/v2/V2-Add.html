<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add sheet</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6E7781; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <a href="V2-Today.html" aria-label="Close" style="height: 56px; flex-shrink: 0"></a>
  <div role="dialog" aria-label="Add money" style="flex-grow: 1; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #8C959F"></div>
    <div role="radiogroup" aria-label="Spent or received" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EAEEF2; border-radius: 14px; padding: 4px; gap: 4px">
      <button type="button" role="radio" aria-checked="true" style="min-height: 48px; border-radius: 10px; border: none; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1F2328">Spent</button>
      <a href="V2-Add-Received.html" role="radio" aria-checked="false" style="min-height: 48px; border-radius: 10px; font-size: 15px; color: #424A53; display: flex; align-items: center; justify-content: center; text-decoration: none">Received</a>
    </div>

    <div style="display: flex; gap: 8px; align-items: center">
      <label style="flex-grow: 1; display: flex; align-items: center; min-height: 48px; border-radius: 24px; border: 1px solid #8C959F; padding: 0 14px; box-sizing: border-box">
        <input type="text" placeholder="Or type: 1200 dinner with Rahul, split 3" aria-label="Type the expense in words" style="flex-grow: 1; border: none; font: inherit; font-size: 14px; color: #1F2328; outline: none; background: transparent">
      </label>
      <button type="button" aria-label="Say it" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #1F2328; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
    </div>

    <div aria-live="polite" style="text-align: center; font-size: 44px; font-weight: 700">₹120</div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #1F2328; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Transport</button>
      <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Food &amp; drink</button>
      <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Groceries</button>
      <a href="V2-Category-Sheet.html" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; box-sizing: border-box; font-size: 14px; color: #1F2328; display: flex; align-items: center; text-decoration: none">All ▾</a>
    </div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">From Cash ▾</button>
      <button type="button" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Today, now ▾</button>
      <a href="V2-Split-Sheet.html" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid #8C959F; box-sizing: border-box; font-size: 13px; color: #1F2328; display: flex; align-items: center; justify-content: center; text-decoration: none">Split</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; flex-grow: 1">
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">1</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">2</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">3</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">4</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">5</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">6</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">7</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">8</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">9</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">.</button>
      <button type="button" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 20px; color: #1F2328">0</button>
      <button type="button" aria-label="Delete digit" style="min-height: 48px; border: none; border-radius: 12px; background: #F6F8FA; font: inherit; font-size: 18px; color: #1F2328">⌫</button>
    </div>
    <a href="V2-Today.html" style="min-height: 52px; border-radius: 26px; background: #0B57D0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">Save ₹120 spent</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
