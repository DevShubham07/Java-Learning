<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Start a trip</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6E7781; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <a href="V2-People.html" aria-label="Close" style="height: 120px; flex-shrink: 0"></a>
  <div role="dialog" aria-label="Start a trip" style="flex-grow: 1; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #8C959F"></div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="flex-grow: 1; font-size: 20px; font-weight: 600">Start a trip</span>
      <a href="V2-People.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Trip name
      <input type="text" value="Goa trip" style="min-height: 48px; border-radius: 12px; border: 2px solid #1F2328; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #1F2328; box-sizing: border-box">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">From
        <input type="text" value="21 Oct" style="min-height: 48px; border-radius: 12px; border: 1px solid #8C959F; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #1F2328; box-sizing: border-box; width: 100%">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">To
        <input type="text" value="26 Oct" style="min-height: 48px; border-radius: 12px; border: 1px solid #8C959F; padding: 0 12px; font: inherit; font-size: 15px; font-weight: 400; color: #1F2328; box-sizing: border-box; width: 100%">
      </label>
    </div>
    <div style="display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 600; padding-bottom: 4px">Who's going?</span>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EAEEF2; font-size: 15px"><input type="checkbox" checked disabled style="width: 22px; height: 22px">You</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EAEEF2; font-size: 15px"><input type="checkbox" checked style="width: 22px; height: 22px">Rahul</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EAEEF2; font-size: 15px"><input type="checkbox" checked style="width: 22px; height: 22px">Aman</label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EAEEF2; font-size: 15px"><input type="checkbox" checked style="width: 22px; height: 22px">Priya</label>
      <a href="V2-Person-Add.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">+ Add a person</a>
    </div>
    <span style="font-size: 12px; color: #424A53; line-height: 1.4">While the trip is on, new payments are suggested as "Split with the trip", tagged to it, and the trip is pinned on People. It switches off after the end date.</span>
    <div style="flex-grow: 1"></div>
    <a href="V2-Trip.html" style="min-height: 52px; border-radius: 26px; background: #0B57D0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Start trip</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
