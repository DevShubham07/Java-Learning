<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add sheet: money received</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6E7781; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <a href="V2-Today.html" aria-label="Close" style="height: 56px; flex-shrink: 0"></a>
  <div role="dialog" aria-label="Add money received" style="flex-grow: 1; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #8C959F"></div>
    <div role="radiogroup" aria-label="Spent or received" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #EAEEF2; border-radius: 14px; padding: 4px; gap: 4px">
      <a href="V2-Add.html" role="radio" aria-checked="false" style="min-height: 48px; border-radius: 10px; font-size: 15px; color: #424A53; display: flex; align-items: center; justify-content: center; text-decoration: none">Spent</a>
      <button type="button" role="radio" aria-checked="true" style="min-height: 48px; border-radius: 10px; border: none; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1F2328">Received</button>
    </div>

    <div aria-live="polite" style="text-align: center; font-size: 44px; font-weight: 700">+₹[rent]</div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">What is it?</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="true" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: none; background: #1F2328; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Rent I collect</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Paying me back</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Salary / income</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Lending me</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; color: #1F2328">Other</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600">Which rent?</span>
      <label style="min-height: 64px; border-radius: 14px; border: 2px solid #1F2328; padding: 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px"><input type="radio" name="rent" checked style="width: 22px; height: 22px; margin: 0">
        <span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Flat 3A · Vikram · October</strong><span style="font-size: 13px; color: #7A3A06; font-weight: 600">₹[rent] pending</span></span></label>
      <label style="min-height: 56px; border-radius: 14px; border: 1px solid #8C959F; padding: 8px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 12px"><input type="radio" name="rent" style="width: 22px; height: 22px; margin: 0">
        <span style="font-size: 15px">Flat 2B · Neha · November (advance)</span></label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 14px"><input type="checkbox" style="width: 22px; height: 22px">Part payment (rest stays pending)</label>
    </div>

    <div style="display: flex; gap: 8px">
      <button type="button" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Into Cash ▾</button>
      <button type="button" style="flex-grow: 1; min-height: 44px; border-radius: 12px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 13px; color: #1F2328">Today ▾</button>
    </div>

    <div style="flex-grow: 1"></div>
    <a href="V2-Bills.html" style="min-height: 52px; border-radius: 26px; background: #0B57D0; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Save · October rent received</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
