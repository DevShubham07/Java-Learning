<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trip</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 4px">
    <a href="V2-People.html" aria-label="Back to people" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 20px; font-weight: 600">Goa trip</h1>
      <span style="font-size: 13px; color: #424A53">21–26 Oct · You, Rahul, Aman, Priya</span>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <label style="display: flex; align-items: center; gap: 12px; border: 2px solid #1F2328; border-radius: 14px; padding: 10px 14px; min-height: 64px; box-sizing: border-box">
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">Trip mode on</strong><span style="font-size: 12px; color: #424A53">New payments go to this trip, split 4 ways</span></span>
      <input type="checkbox" role="switch" checked style="width: 44px; height: 24px">
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="border: 1px solid #D0D7DE; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #57606A">Your share</span><strong style="font-size: 20px">₹[x]</strong></div>
      <div style="border: 1px solid #D0D7DE; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #57606A">Trip total</span><strong style="font-size: 20px">₹[x]</strong></div>
    </div>

    <div style="display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 600; padding-bottom: 4px">Payments</span>
      <div style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Villa booking</span><span style="font-size: 12px; color: #424A53">Rahul paid · 4 ways</span></span><strong>₹[x]</strong></div>
      <div style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Scooter rental</span><span style="font-size: 12px; color: #424A53">You paid · 4 ways</span></span><strong>₹[x]</strong></div>
      <div style="display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Beach dinner</span><span style="font-size: 12px; color: #424A53">Aman paid · 3 ways</span></span><strong>₹[x]</strong></div>
    </div>

    <div style="background: #F6F8FA; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
      <strong style="font-size: 15px">To settle: 3 transfers</strong>
      <div style="display: flex; justify-content: space-between; font-size: 14px; min-height: 32px; align-items: center"><span>You → Rahul</span><strong>₹[x]</strong></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; min-height: 32px; align-items: center"><span>Aman → You</span><strong>₹[x]</strong></div>
      <div style="display: flex; justify-content: space-between; font-size: 14px; min-height: 32px; align-items: center"><span>Priya → Rahul</span><strong>₹[x]</strong></div>
    </div>
  </div>

  <div style="border-top: 1px solid #D0D7DE; padding: 12px 16px 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="min-height: 52px; border-radius: 26px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; color: #1F2328">Share plan</button>
    <a href="V2-People.html" style="min-height: 52px; border-radius: 26px; background: #1F2328; color: #FFFFFF; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">End trip</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
