  <div style="padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 4px">

        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; flex-grow: 1; font-size: 20px; font-weight: 600">Manage people</h1>
      <a href="V2-Person-Add.html" style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #8C959F; box-sizing: border-box; font-size: 14px; font-weight: 600; color: #1F2328; display: flex; align-items: center; text-decoration: none">+ Add</a>

    </label>
    <span style="font-size: 13px; color: #424A53">3 matches · searches name, phone and UPI ID</span>
  </div>

  <div style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="display: flex; flex-direction: column">
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #EAEEF2">

        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Rahul</span><span style="font-size: 12px; color: #424A53">Friend · [phone] · you owe ₹110</span></span>
        <span style="font-size: 13px; font-weight: 600; color: #0B57D0">Edit</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #EAEEF2; background: #F6F8FA; margin: 0 -16px; padding: 0 16px">
        <input type="checkbox" checked style="width: 22px; height: 22px">
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">Rajesh</span><span style="font-size: 12px; color: #424A53">Old flatmate · settled · last seen May</span></span>
        <span style="font-size: 13px; font-weight: 600; color: #0B57D0">Edit</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 64px; border-bottom: 1px solid #EAEEF2">

        <span style="font-size: 13px; font-weight: 600; color: #0B57D0">Edit</span>
      </label>
    </div>
    <div style="border: 1px dashed #8C959F; border-radius: 12px; padding: 12px; font-size: 13px; color: #424A53; line-height: 1.5">
      <strong style="color: #1F2328">Delete</strong> removes the person and their contact details; past payments keep a plain name. Blocked while money is owed either way: settle or write it off first.
    </div>
  </div>

  <div style="border-top: 1px solid #D0D7DE; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; color: #424A53">1 selected · Rajesh</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 48px; border-radius: 24px; border: 1px solid #8C959F; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1F2328">Merge</button>
      <button type="button" style="min-height: 48px; border-radius: 24px; border: 2px solid #7A3A06; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #7A3A06">Delete…</button>
