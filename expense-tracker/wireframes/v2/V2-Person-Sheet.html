<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Person sheet</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#0B57D0}a:hover{color:#08408F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #6E7781; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2328; display: flex; flex-direction: column; overflow: hidden">
  <a href="V2-People.html" aria-label="Close" style="height: 120px; flex-shrink: 0"></a>
  <div role="dialog" aria-label="Sana" style="flex-grow: 1; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #8C959F"></div>
    <div style="display: flex; align-items: center; gap: 12px">
      <span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 26px; background: #EAEEF2; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 600">S</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 18px; font-weight: 600">Sana</span>
        <span style="font-size: 13px; color: #424A53">Flatmate · [upi-id]@okaxis</span>
      </div>
      <a href="V2-People-Manage.html" style="min-height: 44px; padding: 0 8px; display: flex; align-items: center; font-size: 14px; font-weight: 600; text-decoration: none">Edit</a>
    </div>

    <div style="border: 2px solid #1F2328; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 14px">Sana owes you</span><strong style="font-size: 26px">₹[x]</strong></div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="min-height: 48px; border-radius: 24px; border: none; background: #0B57D0; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">WhatsApp reminder</button>
        <button type="button" style="min-height: 48px; border-radius: 24px; border: 2px solid #1F2328; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; color: #1F2328">Record payment</button>
      </div>
      <span style="font-size: 12px; color: #424A53">A UPI payment from their UPI ID is matched and offered as settled automatically.</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <span style="font-size: 14px; font-weight: 600; padding-bottom: 4px">What makes up ₹[x]</span>
      <div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Rent share · October</span><span style="font-size: 12px; color: #424A53">Flat 4C, recurring</span></span><strong>+₹[x]</strong></div>
      <div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Groceries · 19 Oct</span><span style="font-size: 12px; color: #424A53">You paid ₹[x]</span></span><strong>+₹[x]</strong></div>
      <div style="display: flex; align-items: center; min-height: 52px; border-bottom: 1px solid #EAEEF2; gap: 8px"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px">Paid you · 12 Oct</span><span style="font-size: 12px; color: #424A53">UPI, matched</span></span><strong>−₹[x]</strong></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#0B57D0","options":["#0B57D0","#1F2328","#B4530A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#0B57D0' };
  }
}
</script>
</body>
</html>
